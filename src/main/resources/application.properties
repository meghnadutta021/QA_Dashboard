# ============================================================
# application.properties — Spring Boot Configuration
# ============================================================
# This file lets you configure your Spring Boot app without
# changing any Java code. Spring reads this file on startup.
# Format: key=value  (one setting per line)
# Lines starting with # are comments — Spring ignores them.
# ============================================================


# ------------------------------------------------------------
# SERVER SETTINGS
# ------------------------------------------------------------

# The port your app listens on.
# After starting, open http://localhost:8080 in your browser.
# Change this if port 8080 is already in use on your machine.
server.port=8080


# ------------------------------------------------------------
# FREEMARKER TEMPLATE ENGINE SETTINGS
# ------------------------------------------------------------

# The file extension for your FreeMarker template files.
# .ftlh stands for FreeMarker Template Language HTML.
# Spring Boot will look for files like "index.ftlh", "report.ftlh", etc.
spring.freemarker.suffix=.ftlh

# Where Spring should look for your template files.
# classpath:/templates/ means the "templates" folder inside
# src/main/resources/ — Maven puts this on the classpath automatically.
spring.freemarker.template-loader-path=classpath:/templates/

# Disable template caching during development.
# With cache=false, every browser refresh re-reads the .ftlh file from disk,
# so you can edit templates and see changes immediately without restarting.
# Set this to true in production for better performance.
spring.freemarker.cache=false


# ------------------------------------------------------------
# QA DASHBOARD CUSTOM SETTINGS
# ------------------------------------------------------------

# The root folder where your JSON test report files live.
# "./" means "relative to where you launch the app from" (the project root).
# Your files will be organised like:
#   qa-data/
#     vantagefitness/
#       web/
#         login/
#           login##abc123##20260510.json
#
# You will read this property in your Java code with:
#   @Value("${qa.data.path}")
#   private String qaDataPath;
qa.data.path=./qa-data


# ------------------------------------------------------------
# FILE UPLOAD (MULTIPART) SETTINGS
# ------------------------------------------------------------
# "Multipart" means an HTTP request whose body is split into
# multiple parts — one for each form field and one for the file.
# This is what happens when an HTML form uses enctype="multipart/form-data".
#
# Spring Boot handles multipart automatically, but you must set size
# limits so the server rejects files that are too large before they
# eat up memory or disk space.

# Enable multipart upload support (true by default in Spring Boot,
# but listed here explicitly so the setting is easy to find and change).
spring.servlet.multipart.enabled=true

# Maximum size of a single uploaded file.
# "10MB" means ten megabytes. Spring rejects anything larger with HTTP 413.
# A JSON test report is typically a few KB, so 10 MB is very generous.
spring.servlet.multipart.max-file-size=10MB

# Maximum size of the entire HTTP request (file + all form fields combined).
# Set slightly higher than max-file-size to account for the form field overhead.
spring.servlet.multipart.max-request-size=10MB
